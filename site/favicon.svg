<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="tintim">
  <title>tintim (ícone)</title>
  <!-- Dois "i" que se inclinam um para o outro e se tocam no alto: um brinde (tim-tim) e, ao mesmo tempo, duas barras de gráfico. -->
  <rect width="100" height="100" rx="24" fill="#0e4a55"/>
  <g stroke="#f3f6f5" stroke-width="10" stroke-linecap="round">
    <path d="M37 80 L43.5 47"/>
    <path d="M63 80 L56.5 47"/>
  </g>
  <circle cx="44.2" cy="31" r="6.6" fill="#f08a72"/>
  <circle cx="55.8" cy="31" r="6.6" fill="#f08a72"/>
  <g stroke="#f08a72" stroke-width="3" stroke-linecap="round">
    <path d="M50 13 V18"/><path d="M40 16 L42.5 19.5"/><path d="M60 16 L57.5 19.5"/>
  </g>
</svg>
